#
# setup-bun — install a pinned, checksum-verified Bun.
#
# WHY THIS EXISTS INSTEAD OF oven-sh/setup-bun
#
# Originally a workaround. The organisation Actions policy is
# `allowed_actions: selected` with `sha_pinning_required: true`, and its
# `patterns_allowed` list contained `denoland/*` but NOT `oven-sh/*`. Any
# workflow referencing oven-sh/setup-bun was rejected before a single job ran —
# startup_failure, zero jobs, no log explaining why. That was the estate's Bun
# ruling contradicting itself: the policy permitted the Deno setup action and
# forbade the Bun one, while LANGUAGE-POLICY.adoc section 1 makes Bun tier 1.
#
# THAT IS NOW FIXED. `oven-sh/*` was added to the organisation allowlist on
# 2026-08-07, so oven-sh/setup-bun would be accepted here today.
#
# This action is KEPT anyway, now as a deliberate choice rather than a
# workaround:
#
#   * The organisation requires SHA pinning for third-party actions, so
#     oven-sh/setup-bun would have to be pinned to a commit SHA regardless —
#     and a pinned action SHA still resolves to whatever that action then
#     downloads at runtime. Pinning the Bun RELEASE and verifying its SHA-256
#     is a stronger guarantee than pinning the installer that fetches it.
#   * It removes a third party from the trust chain entirely.
#   * It is about twenty lines and has no dependencies.
#
# If you would rather use the upstream action, it is now permitted: pin it to a
# commit SHA and add it to .github/workflows/actions.lock.
#
# To bump: change BUN_VERSION and BUN_SHA256 together. The checksum is published
# at the release as SHASUMS256.txt and also appears as the asset `digest` in the
# GitHub API — check both agree before changing it.

name: Set up Bun
description: Install a pinned, checksum-verified Bun without a third-party action.

runs:
  using: composite
  steps:
    - name: Install Bun
      shell: bash
      env:
        BUN_VERSION: "1.3.14"
        BUN_SHA256: "951ee2aee855f08595aeec6225226a298d3fea83a3dcd6465c09cbccdf7e848f"
      run: |
        set -euo pipefail
        url="https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip"
        tmp="$(mktemp -d)"
        curl -fsSL --retry 3 -o "$tmp/bun.zip" "$url"

        actual="$(sha256sum "$tmp/bun.zip" | cut -d' ' -f1)"
        if [ "$actual" != "$BUN_SHA256" ]; then
          echo "::error::Bun checksum mismatch. expected $BUN_SHA256, got $actual"
          exit 1
        fi
        echo "checksum ok: $actual"

        unzip -q "$tmp/bun.zip" -d "$tmp"
        install -Dm755 "$tmp/bun-linux-x64/bun" "$HOME/.bun/bin/bun"
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

    - name: Verify
      shell: bash
      run: |
        set -euo pipefail
        echo "bun $(bun --version)"
