name: Mirror to Git Forges
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  mirror:
    uses: hyperpolymath/standards/.github/workflows/mirror-reusable.yml@092dedada188f56c5915f74a5fd40aac093742c3
    secrets: inherit
    # The reusable's job requests actions: read; a caller cannot grant less
    # than its callee asks, or GitHub refuses the run at startup (standards#451;
    # B-PERMS in metadatastician-governance#30).
    permissions:
      actions: read
      contents: read
