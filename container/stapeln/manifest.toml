# SPDX-License-Identifier: MPL-2.0
#
# Cerro Torre manifest for Consent-Aware Web .ctp bundle
#
# This manifest describes the container image for verified
# container packaging. Used by `ct pack` to create .ctp bundles.

[metadata]
name = "consent-aware-web"
version = "0.1.0"
revision = 1
summary = "IETF-track specifications for consent-aware HTTP: AIBDP manifests and the 430 Consent Required status code"
description = """
Consent-Aware Web — containerised service packaged as a verified
cerro-torre .ctp bundle with Ed25519 signing and full provenance
tracking.
"""
license = "MPL-2.0"
homepage = "https://github.com/metadatastician/consent-aware-web"
maintainer = "Jonathan D.A. Jewell <jonathan@metadatastician.art>"

[provenance]
upstream = "https://github.com/metadatastician/consent-aware-web"
import_date = 2026-08-07T00:00:00Z

[dependencies]
runtime = ["ca-certificates", "curl"]
build = []

[build]
system = "podman"

[build.environment]
APP_HOST = "[::]"
APP_PORT = "8080"

[outputs]
primary = "consent-aware-web"
split = []

[attestations]
require = ["source-signature", "sbom-complete"]
recommend = ["security-audit", "reproducible-build"]

# Runtime security profile
[security]
user = "appuser"
group = "appuser"
read_only_root = false
no_new_privileges = true

[security.capabilities]
drop = ["ALL"]
add = ["NET_BIND_SERVICE"]

[security.network]
listen_tcp = [8080]

[security.filesystem]
read = ["/app/", "/data/"]
write = ["/data/", "/tmp/"]
execute = ["/app/entrypoint.sh"]
